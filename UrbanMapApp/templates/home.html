{% extends 'base.html' %}
{% block title %}Urban Problem Mapper{% endblock %}

{% block content %}
    <h1 class="mb-4">Urban Problem Mapping</h1>
    <div class="row">
        <!-- Map container -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    Interactive Map
                </div>
                <div id="map" style="height: 600px; width: 100%;"></div>
            </div>
        </div>

        <!-- submission form -->
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    Submit a New Report
                </div>
                <div class="card-body">
                    <form id="reportForm" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <p class="text-center text-muted">Click on the map to select a location.</p>

                    <input type="hidden" name="latitude" id="id_latitude" required>
                    <input type="hidden" name="longitude" id="id_longitude" required>

                    <div class="mb-3">
                        <label for="id_title" class="form-label">Title</label>
                        <input type="text" name="title" id="id_title" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="id_description" class="form-label">Description</label>
                        <textarea name="description" id="id_description" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="id_category" class="form-label">Category</label>
                        <select name="category" id="id_category" class="form-select" required>
                            <option value="" selected disabled>-- Select a category --</option>
                            {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="id_photo" class="form-label">Photo</label>
                        <input type="file" name="photo" id="id_photo" class="form-control" accept="image/*" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary" disabled>Submit Report</button>
                    </div>
                </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
{{ block.super }}

<!-- JavaScript for Google Maps functionality -->
<script>
    let map;
    let submissionMarker = null;
    let infoWindow;
     const iconUrls = {
            'PENDING': 'http://maps.google.com/mapfiles/ms/icons/red-dot.png',
            'IN_PROGRESS': 'http://maps.google.com/mapfiles/ms/icons/yellow-dot.png',
            'RESOLVED': 'http://maps.google.com/mapfiles/ms/icons/green-dot.png'
        };
    function initMap() {
        const athens = { lat: 37.983810, lng: 23.727539 };

        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 12,
            center: athens,
        });

        infoWindow = new google.maps.InfoWindow();


        map.addListener("click", (event) => {
            placeSubmissionMarker(event.latLng);
        });


        const reportsData = JSON.parse('{{ reports_json|safe }}');

        reportsData.forEach(report => {
            const iconUrl = iconUrls[report.status] || iconUrls['PENDING'];
            const marker = new google.maps.Marker({
                position: { lat: report.lat, lng: report.lng },
                map: map,
                title: report.title,
                icon: iconUrl
            });
            //marker info window
            const contentString = `
                <div>
                    <h5>${report.title}</h5>
                    <p><strong>Category:</strong> ${report.category}</p>
                    <p>${report.description}</p>
                    <img src="${report.photo_url}" alt="${report.title}" style="max-width: 200px; height: auto;">
                </div>
            `;

            marker.addListener('click', () => {
                infoWindow.setContent(contentString);
                infoWindow.open(map, marker);
            });
        });
    }

    // This function handles placing the marker for a NEW submission
    function placeSubmissionMarker(location) {
        if (submissionMarker) {
            submissionMarker.setMap(null);
        }
        submissionMarker = new google.maps.Marker({
            position: location,
            map: map,
        });
        document.getElementById("id_latitude").value = location.lat();
        document.getElementById("id_longitude").value = location.lng();
        document.querySelector('#reportForm button[type="submit"]').disabled = false;
    }
</script>

<!-- Load the Google Maps API using the secure key from our view -->
<script async defer src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&callback=initMap"></script>

{% endblock %}
